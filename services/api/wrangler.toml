name = "cios-workers-api"
main = "src/worker.ts"
compatibility_date = "2026-03-30"

[observability]
enabled = true

[vars]
API_CONTRACT = "phase2-workers-v1"
JWT_ISSUER = "cios.iai.one"
JWT_AUDIENCE = "cios-workers-api"
# Optional. If set, /v1/flow/callback requires x-flow-signature (HMAC-SHA256).
# FLOW_WEBHOOK_SECRET should be configured via wrangler secret.

[[d1_databases]]
binding = "CIOS_DB"
database_name = "cios-workers-api-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "CIOS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
