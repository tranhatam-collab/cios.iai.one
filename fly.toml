app = "cios-api"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  APP_BASE_URL = "https://cios-api.fly.dev"
  FRONTEND_URL = "https://cios.iai.one"
  AIAGENT_API_URL = "https://aiagent.iai.one"

[[services]]
  internal_port = 8080
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
