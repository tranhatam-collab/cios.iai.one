name: Credential health

# Read-only weekly check that the Cloudflare deploy token still works, so an expired token is found
# before a release instead of during it (the 2026-11-06 deploy failed with "Invalid access token").
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_LOCK: f3f9e76222dcb488d5e303e29e8ba192

jobs:
  cloudflare-token:
    name: Cloudflare deploy token is valid
    runs-on: ubuntu-latest
    steps:
      - name: Check account lock, Workers access and Pages access (GET only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          if [ "$ACCOUNT_ID" != "$CLOUDFLARE_ACCOUNT_LOCK" ]; then
            echo "::error::secrets.CLOUDFLARE_ACCOUNT_ID is not the production account lock (${CLOUDFLARE_ACCOUNT_LOCK})."
            exit 1
          fi
          check() {
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" "$2")"
            if [ "$code" != "200" ]; then
              echo "::error::$1 returned HTTP ${code}: CLOUDFLARE_API_TOKEN is invalid, expired or lacks Workers Scripts / Pages access."
              exit 1
            fi
            echo "ok: $1"
          }
          check "Workers script cios-workers-api" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/cios-workers-api/settings"
          check "Pages project cios-iai-one" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/cios-iai-one"
