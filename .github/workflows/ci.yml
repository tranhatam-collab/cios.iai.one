name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Production Cloudflare account that owns cios.iai.one (Founder-confirmed 2026-10-27).
  # Deploy jobs refuse to run against any other account.
  CLOUDFLARE_ACCOUNT_LOCK: f3f9e76222dcb488d5e303e29e8ba192

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Workers dependencies
        working-directory: services/api
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ci
          JWT_SECRET: ci-jwt-secret-at-least-32-chars
          SESSION_SECRET: ci-session-secret-at-least-32
          AIAGENT_API_URL: https://api.aiagent.iai.one
          FRONTEND_URL: https://cios.iai.one

      - name: Typecheck Workers API
        working-directory: services/api
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ci
          JWT_SECRET: ci-jwt-secret-at-least-32-chars
          SESSION_SECRET: ci-session-secret-at-least-32
          FLOW_WEBHOOK_SECRET: ci-flow-webhook-secret
          AIAGENT_API_URL: https://api.aiagent.iai.one
          FRONTEND_URL: https://cios.iai.one
          LOG_LEVEL: silent

  # Production deploys only from main; dev and pull requests stop at build-test.
  deploy-workers:
    name: Deploy Cloudflare Workers API
    needs: build-test
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: Verify Cloudflare account lock
        run: |
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [ "$ACCOUNT_ID" != "$CLOUDFLARE_ACCOUNT_LOCK" ]; then
            echo "::error::secrets.CLOUDFLARE_ACCOUNT_ID is not the production account lock (${CLOUDFLARE_ACCOUNT_LOCK})."
            exit 1
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install Workers dependencies
        working-directory: services/api
        run: npm ci --legacy-peer-deps

      # GIT_SHA lets post-deploy smoke confirm the edge serves this exact commit (/v1/meta release.commit).
      - name: Deploy Workers API
        working-directory: services/api
        run: npx wrangler deploy --var "GIT_SHA:${GITHUB_SHA}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-pages:
    name: Deploy Cloudflare Pages
    needs: build-test
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Writes site/version.json including commit=GITHUB_SHA for the post-deploy version check.
      - name: Sync site version manifest
        run: node scripts/sync-site-version.mjs

      # Strip leading/trailing whitespace/newlines from the secret (common paste mistake) then verify + deploy.
      - name: Publish to Cloudflare Pages
        run: |
          set -euo pipefail
          TOKEN="$(python3 -c "import os; print(os.environ['CLOUDFLARE_API_TOKEN'].strip())")"
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty after trim. Add the API token under Settings → Secrets → Actions."
            exit 1
          fi
          ACCOUNT_ID="$(python3 -c "import os; print(os.environ['CLOUDFLARE_ACCOUNT_ID'].strip())")"
          if [ "$ACCOUNT_ID" != "$CLOUDFLARE_ACCOUNT_LOCK" ]; then
            echo "::error::secrets.CLOUDFLARE_ACCOUNT_ID is not the production account lock (${CLOUDFLARE_ACCOUNT_LOCK})."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/cios-iai-one" \
            -H "Authorization: Bearer ${TOKEN}")
          if [ "$code" != "200" ]; then
            echo "::error::Cloudflare API returned HTTP ${code} for Pages project lookup on account ${ACCOUNT_ID}."
            echo "Use an API Token with Account → Cloudflare Pages → Edit on this account; not the Global API Key."
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN="$TOKEN"
          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
          npx --yes wrangler@4 pages deploy site --project-name=cios-iai-one
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Post-deploy smoke runs against what was just deployed and fails unless the edge serves this commit.
  smoke-workers:
    name: Smoke Workers (post-deploy)
    needs: deploy-workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke workers (read-only, expects this commit)
        run: npm run smoke:workers:readonly
        env:
          WORKERS_API_URL: ${{ secrets.SMOKE_WORKERS_API_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}

  smoke-pages:
    name: Smoke Pages (post-deploy)
    needs: deploy-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke production Pages (expects this commit)
        run: npm run smoke:pages
        env:
          PAGES_SITE_URL: https://cios.iai.one
          EXPECTED_COMMIT: ${{ github.sha }}
