name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ci
          JWT_SECRET: ci-jwt-secret
          SESSION_SECRET: ci-session-secret
          LOG_LEVEL: silent

  deploy-pages:
    name: Deploy Cloudflare Pages
    needs: build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 93112cc89181e75335cbd7ef7e392ba3
          command: pages deploy site --project-name=cios-iai-one

      - name: Smoke test (production Pages URL)
        run: |
          curl -fsS --retry 5 --retry-delay 4 --retry-all-errors \
            "https://cios-iai-one.pages.dev/" | grep -q "Customer Intelligence OS"
