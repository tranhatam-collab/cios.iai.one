name: CI

on:
  push:
    branches: [main, dev, 'OMCODE/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      staging_smoke:
        description: Run write-capable smoke against isolated staging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ci
          JWT_SECRET: ci-jwt-secret
          SESSION_SECRET: ci-session-secret
          FLOW_WEBHOOK_SECRET: ci-flow-webhook-secret
          LOG_LEVEL: silent
      - run: node --test scripts/smoke-workers-preflight.check.mjs
      - name: Dependency security audit
        timeout-minutes: 5
        env:
          npm_config_fetch_retries: '0'
          npm_config_fetch_timeout: '30000'
        run: npm audit --audit-level=moderate --json | tee dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cios-security-${{ github.sha }}
          path: dependency-audit.json
          if-no-files-found: warn

  staging-workers-smoke:
    needs: build-test
    if: github.event_name == 'workflow_dispatch' && inputs.staging_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Strict smoke (missing credential fails closed)
        run: npm run smoke:workers:strict | tee staging-smoke.json
        env:
          JWT_SECRET: ${{ secrets.SMOKE_WORKERS_JWT_SECRET }}
          FLOW_WEBHOOK_SECRET: ${{ secrets.SMOKE_WORKERS_FLOW_WEBHOOK_SECRET }}
          WORKERS_API_URL: ${{ vars.SMOKE_WORKERS_API_URL }}
          WORKERS_SMOKE_ENVIRONMENT: staging
          WORKERS_SMOKE_WRITE_ACK: STAGING_ONLY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cios-staging-smoke-${{ github.sha }}
          path: staging-smoke.json
          if-no-files-found: warn

# No deployment job: Production remains HOLD. An approved release workflow,
# exact candidate/runtime receipt and rollback packet are separate Ops gates.
