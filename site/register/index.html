<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="CIOS Register — Create your account." />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>Register — CIOS</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="cios-app">
      <header class="cios-header" role="banner">
        <div class="cios-brand">
          <a href="/" style="text-decoration:none;color:inherit;"><strong>CIOS</strong></a>
          <span>Decision Operating System</span>
        </div>
      </header>

      <main class="cios-main" id="main" style="max-width:420px;margin:3rem auto;">
        <section class="cios-story-block">
          <h1 style="text-align:center;">Create Account</h1>
          <form id="register-form" style="display:flex;flex-direction:column;gap:1rem;">
            <div>
              <label>Full Name</label>
              <input id="name" type="text" required placeholder="Your Name" style="width:100%;padding:0.6rem;border-radius:0.4rem;border:1px solid var(--cios-border);" />
            </div>
            <div>
              <label>Email</label>
              <input id="email" type="email" required placeholder="you@company.com" style="width:100%;padding:0.6rem;border-radius:0.4rem;border:1px solid var(--cios-border);" />
            </div>
            <div>
              <label>Password</label>
              <input id="password" type="password" required minlength="8" placeholder="Min 8 characters" style="width:100%;padding:0.6rem;border-radius:0.4rem;border:1px solid var(--cios-border);" />
            </div>
            <div>
              <label>Workspace</label>
              <input id="workspace" type="text" value="demo" required style="width:100%;padding:0.6rem;border-radius:0.4rem;border:1px solid var(--cios-border);" />
            </div>
            <button type="submit" class="cios-cta cios-cta-primary" style="width:100%;">Create Account</button>
          </form>

          <div style="text-align:center;margin:1.5rem 0;">
            <span style="color:var(--cios-muted);">or</span>
          </div>

          <a href="/v1/auth/google" class="cios-cta cios-cta-secondary" style="width:100%;display:block;text-align:center;text-decoration:none;">
            Sign up with Google
          </a>

          <p style="text-align:center;margin-top:1.5rem;color:var(--cios-muted);">
            Already have an account? <a href="/login/">Sign in</a>
          </p>
          <p id="error-msg" style="color:#991b1b;text-align:center;margin-top:1rem;"></p>
          <p id="success-msg" style="color:#166534;text-align:center;margin-top:1rem;"></p>
        </section>
      </main>

      <footer class="cios-footer" role="contentinfo">
        <p>
          <a href="/legal/privacy.html">Privacy</a> ·
          <a href="/legal/terms.html">Terms</a> ·
          <a href="/security/">Security</a>
        </p>
      </footer>
    </div>

    <script type="module">
      import {
        apiPost,
        apiUrl,
        getToken
      } from "/js/api-client.js";

      const token = getToken();
      if (token) {
        window.location.href = "/app/";
      }

      const googleLink = document.querySelector('a[href="/v1/auth/google"]');
      if (googleLink) {
        googleLink.href = apiUrl("/v1/auth/google");
      }

      const form = document.getElementById("register-form");
      const errorMsg = document.getElementById("error-msg");
      const successMsg = document.getElementById("success-msg");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorMsg.textContent = "";
        successMsg.textContent = "";

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const displayName = document.getElementById("name").value;
        const workspaceCode = document.getElementById("workspace").value;

        try {
          await apiPost("/v1/auth/register", {
            email,
            password,
            displayName,
            workspaceCode
          });

          successMsg.textContent = "Account created! Redirecting to login...";
          setTimeout(() => {
            window.location.href = "/login/";
          }, 1500);
        } catch (err) {
          errorMsg.textContent = err?.message || "Network error. Please try again.";
        }
      });
    </script>
  </body>
</html>
