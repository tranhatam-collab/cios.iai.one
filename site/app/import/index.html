<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="CIOS Import — CSV upload and manual company add." />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>Import — CIOS</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="cios-app-shell">
      <aside class="cios-sidebar" aria-label="App navigation"></aside>
      <header class="cios-topbar">
        <div><strong>CIOS App</strong></div>
        <div><button id="logout-btn" class="cios-btn">Log out</button></div>
      </header>
      <main class="cios-app-main" id="main">
        <h1 class="cios-page-title">Import</h1>
        <section class="cios-story-block">
          <h2>Coming in R2</h2>
          <p>
            CSV import and manual create write paths are deferred outside R1 Working Product.
            R1 ships authenticated <strong>read</strong> surfaces for accounts, signals, priorities, and audit.
          </p>
          <p><a class="cios-btn cios-btn-primary" href="/app/accounts/">Browse accounts</a></p>
        </section>
      </main>
    </div>
    <script type="module">
      import { renderSidebar, bindLogout, requireAuth } from "/js/app-shell.js";
      requireAuth();
      renderSidebar("/app/import/");
      bindLogout();
    </script>
  </body>
</html>
