<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="CIOS Account Detail — signals, score, risk, actions." />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>Account Detail — CIOS</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="cios-app-shell">
      <aside class="cios-sidebar" aria-label="App navigation"></aside>
      <header class="cios-topbar">
        <div><strong>CIOS App</strong></div>
        <div><button id="logout-btn" class="cios-btn">Log out</button></div>
      </header>
      <main class="cios-app-main" id="main">
        <div style="margin-bottom:1rem;"><a href="./">&larr; Back to accounts</a></div>
        <div id="account-detail"></div>
      </main>
    </div>
    <script type="module">
      import { renderSidebar, apiGet, renderEmpty, scoreBadge, bindLogout, requireAuth } from "/js/app-shell.js";
      requireAuth();
      renderSidebar("/app/accounts/");
      bindLogout();

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const container = document.getElementById("account-detail");

      if (!id) {
        renderEmpty(container, "No account selected.");
      } else {
        loadAccount(id);
      }

      async function loadAccount(accountId) {
        try {
          const res = await apiGet(`/v1/crm/organizations/${encodeURIComponent(accountId)}`);
          const org = res?.data?.organization;
          if (!org) {
            renderEmpty(container, "Account not found.");
            return;
          }
          container.innerHTML = `
            <h1 class="cios-page-title">${org.name}</h1>
            <section class="cios-grid cios-grid-2">
              <article class="cios-card">
                <h3>Overview</h3>
                <p><strong>Domain:</strong> ${org.domain}</p>
                <p><strong>Industry:</strong> ${org.industry}</p>
                <p><strong>Stage:</strong> ${org.stage}</p>
                <p><strong>Owner:</strong> ${org.owner}</p>
              </article>
              <article class="cios-card">
                <h3>Score Breakdown</h3>
                <p><strong>Fit Score:</strong> ${scoreBadge(org.fitScore)}</p>
                <p><strong>Intent Score:</strong> ${scoreBadge(org.intentScore)}</p>
              </article>
            </section>
            <section class="cios-story-block">
              <h2>AI Insights</h2>
              <p>AI enrichment and website analysis ship in R2. R1 shows account read data only.</p>
            </section>
          `;
        } catch {
          renderEmpty(container, "Could not load account detail.");
        }
      }
    </script>
  </body>
</html>
