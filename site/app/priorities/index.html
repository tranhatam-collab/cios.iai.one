<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="CIOS Priorities — daily account priority briefing." />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>Priorities — CIOS</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="cios-app-shell">
      <aside class="cios-sidebar" aria-label="App navigation"></aside>
      <header class="cios-topbar">
        <div><strong>CIOS App</strong></div>
        <div><button id="logout-btn" class="cios-btn">Log out</button></div>
      </header>
      <main class="cios-app-main" id="main">
        <h1 class="cios-page-title">Priorities Today</h1>
        <div id="priorities-table"></div>
      </main>
    </div>
    <script type="module">
      import { renderSidebar, apiGet, renderEmpty, scoreBadge, riskBadge, bindLogout, requireAuth, unwrapList } from "/js/app-shell.js";
      requireAuth();
      renderSidebar("/app/priorities/");
      bindLogout();

      async function loadPriorities() {
        const container = document.getElementById("priorities-table");
        try {
          const res = await apiGet("/v1/crm/organizations");
          const orgs = unwrapList(res, ["organizations"])
            .filter(o => o.fitScore >= 60)
            .sort((a, b) => b.fitScore - a.fitScore);
          if (orgs.length === 0) {
            renderEmpty(container, "No priorities yet. Build your account list.");
            return;
          }
          container.innerHTML = `<table class="cios-table"><thead><tr><th>Rank</th><th>Company</th><th>Reason</th><th>Score</th><th>Risk</th><th>Action</th></tr></thead><tbody>` +
            orgs.map((o, i) =>
              `<tr><td>${i + 1}</td><td><a href="/app/accounts/detail.html?id=${encodeURIComponent(o.id)}">${o.name}</a></td><td>High fit score</td><td>${scoreBadge(o.fitScore)}</td><td>${riskBadge("low")}</td><td><a class="cios-btn cios-btn-primary" href="/app/actions/">Act</a></td></tr>`
            ).join("") + `</tbody></table>`;
        } catch {
          renderEmpty(container, "Could not load priorities.");
        }
      }
      loadPriorities();
    </script>
  </body>
</html>
