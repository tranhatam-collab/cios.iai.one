<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="CIOS Settings — workspace and data preferences." />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>Settings — CIOS</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="cios-app-shell">
      <aside class="cios-sidebar" aria-label="App navigation"></aside>
      <header class="cios-topbar">
        <div><strong>CIOS App</strong></div>
        <div><button id="logout-btn" class="cios-btn">Log out</button></div>
      </header>
      <main class="cios-app-main" id="main">
        <h1 class="cios-page-title">Settings</h1>

        <section class="cios-story-block">
          <h2>Data &amp; Privacy</h2>
          <p>Self-service export and deletion are not available in R1. To request deletion of your data, use the <a href="/legal/deletion-request.html">deletion request process</a> (email cios@iai.one).</p>
          <button id="export-btn" class="cios-btn" disabled title="Not available in R1">Export workspace data</button>
          <button id="delete-btn" class="cios-btn" style="margin-left:0.5rem;" disabled title="Not available in R1">Delete workspace data</button>
        </section>

        <section class="cios-story-block">
          <h2>Subscription</h2>
          <div id="subscription-info"></div>
          <div id="plans-list" style="margin-top:1rem;"></div>
          <pre id="payment-result" style="margin-top:1rem;background:#f3f4f6;padding:1rem;border-radius:0.5rem;font-size:0.85rem;"></pre>
        </section>

        <section class="cios-story-block">
          <h2>Reset Demo Data</h2>
          <p>Demo reset is not available in R1.</p>
          <button id="reset-btn" class="cios-btn" disabled title="Not available in R1">Reset demo data</button>
        </section>
      </main>
    </div>
    <script type="module">
      import { renderSidebar, requireAuth, apiGet, apiPost, bindLogout } from "/js/app-shell.js";
      requireAuth();
      renderSidebar("/app/settings/");
      bindLogout();

      const payOut = document.getElementById("payment-result");
      const subInfo = document.getElementById("subscription-info");
      const plansList = document.getElementById("plans-list");

      // Payment / Stripe is R2 — outside R1 Working Product scope.
      subInfo.innerHTML = `<p>Billing is not enabled in R1. Contact support for plan changes.</p>`;
      plansList.innerHTML = `<p class="cios-muted">Stripe checkout arrives in R2.</p>`;
      if (payOut) payOut.textContent = "";

      // R1 has no export, delete or demo-reset endpoint, so those controls are disabled in the markup above.
      // They used to print "request submitted" / "reset completed" without calling anything.
    </script>
  </body>
</html>
